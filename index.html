<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diario del desarrollador</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<nav id="menu" aria-label="Menú principal">
<ul>
<li><a href="index.html">HOME</a></li>
<li><a href="trabajo1.html">TRABAJO 1</a></li>
<li class="tema"><button id="boton-tema" type="button" aria-pressed="false">☀️ Modo claro</button></li>
</ul>
</nav>
<h1 id="titulo">Diario del desarrollador</h1>
<p>Soy Unai Pescador y este es mi primer proyecto de DWEC.</p>
<div class="controles">
<button id="boton-pulsar" type="button">Púlsame</button>
<span>Has cliqueado <strong id="contador">0</strong> veces</span>
</div>

<section class="contacto" aria-labelledby="titulo-formulario">
<h2 id="titulo-formulario">Formulario de contacto</h2>
<form id="formulario-contacto" novalidate>
<div class="campo">
<label for="nombre">Nombre</label>
<input id="nombre" name="nombre" type="text" placeholder="Escribe tu nombre" required>
</div>
<div class="campo">
<label for="apellidos">Apellidos</label>
<input id="apellidos" name="apellidos" type="text" placeholder="Escribe tus apellidos" required>
</div>
<div class="campo">
<label for="correo">Correo electrónico</label>
<input id="correo" name="correo" type="email" placeholder="correo@ejemplo.com" required>
</div>
<div class="campo">
<label for="mensaje">Mensaje</label>
<textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu comentario" required></textarea>
</div>
<button type="submit">Enviar</button>
<p id="mensaje-formulario" class="mensaje-formulario" aria-live="polite"></p>
</form>
</section>
<script src="app.js"></script>
</body>

</html>
